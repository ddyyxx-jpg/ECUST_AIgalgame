# ECUST AI 校园：只允许通过公网 IP 访问，不绑定任何域名。
# 443 的 catch-all 返回 404；已有域名（如 huaaaji.cloud）仍由原 server_name 命中 WordNote。
# 这样即使域名解析到同一台机器，也不会落到游戏。
limit_req_zone $binary_remote_addr zone=galgame_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=galgame_register:10m rate=10r/m;

# catch-all：非 IP Host（且不是已有域名）一律 404，不进入游戏
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/ecust-galgame.crt;
    ssl_certificate_key /etc/nginx/ssl/ecust-galgame.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:galgame_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    return 404;
}

# 游戏只接受 IP 作为 Host（浏览器地址栏 https://<公网IP>/）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __GALGAME_PUBLIC_IP__;

    ssl_certificate     /etc/nginx/ssl/ecust-galgame.crt;
    ssl_certificate_key /etc/nginx/ssl/ecust-galgame.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:galgame_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    root /opt/ecust-galgame/web;
    index index.html;

    # 登录单独限流；应用内还有按用户名/5 次每分钟的失败限制
    location = /api/v1/auth/login {
        limit_req zone=galgame_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # 注册/重置凭证单独限流（建议7）；应用内还有按 IP 的注册/重置失败限制
    location = /api/v1/auth/register {
        limit_req zone=galgame_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/reset-password {
        limit_req zone=galgame_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # 本地模型设置端点会改服务端出站目标；试用期统一用服务端 key，直接封掉
    location /api/v1/settings/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/turns）不能缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
